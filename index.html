<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form and Inputs</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <form action="submit.html" method="get" autocomplete="on">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required placeholder="Enter your name">

            <label for="email"> Email</label>
            <input type="email" id="email" name="email" required placeholder="abd@email.com">

            <label for="tel">Tel</label>
            <input type="tel" id="tel" name="tel" required placeholder="+91 1234567890">
            
        </fieldset>

        <fieldset>
            <legend>Hobbies</legend>

            <label class="choice">
                <input type="checkbox" name="hobbies" value="reading">
                Reading
            </label>
            <label class="choice">
                <input type="checkbox" name="hobbies" value="traveling">
                Traveling
            </label>
            <label class="choice">
                <input type="checkbox" name="hobbies" value="gaming">
                Gaming
            </label>
            <label class="choice">
                <input type="checkbox" name="hobbies" value="football">
                Football
            </label>
        </fieldset>

        <fieldset>
            <legend>Profession</legend>
            <p class="profession-text">Please choose only one profession</p>

            <label class="choice">
                <input type="radio" name="profession" value="mobile">
                Mobile Developer
            </label>
            <label class="choice">
                <input type="radio" name="profession" value="backend">
                Back End Developer
            </label>
            <label class="choice">
                <input type="radio" name="profession" value="frontend">
                Front End Developer
            </label>
            <label class="choice">
                <input type="radio" name="profession" value="fullstack">
                Full Stack Developer
            </label>
        </fieldset>

        <fieldset>
            <legend>Preferences</legend>
            <label for="Country">Country</label>
            <select name="country" id="country">
                <optgroup label="Asia">
                    <option value="India">India</option>
                    <option value="China">China</option>
                </optgroup>

                <optgroup label="Europe">
                    <option value="Germany">Germany</option>
                    <option value="France">France</option>
                </optgroup>

                <optgroup label="America">
                    <option value="USA">USA</option>
                    <option value="Canada">Canada</option>
                </optgroup>

                <optgroup label="Africa">
                    <option value="Nigeria">Nigeria</option>
                    <option value="South Africa">South Africa</option>
                </optgroup>
            </select>
        </fieldset>

        <fieldset>
            <legend>Bio</legend>
            <label for="bio">Bio</label>
            <textarea name="bio" id="bio" rows="5" placeholder="Write something about yourself..."></textarea>
        </fieldset>

        <div class="button-container">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>
    </form>

</body>
</html>
